name: Build KALA Self-Building APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Buildozer + Accept Licenses + Pin Build-Tools 33.0.2
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk python3-pip zip unzip libffi-dev libssl-dev libbz2-dev libsqlite3-dev libltdl-dev
          pip3 install --upgrade pip
          pip3 install buildozer cython==0.29.33
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd /tmp
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mkdir -p $ANDROID_HOME/cmdline-tools/latest
          mv cmdline-tools/* $ANDROID_HOME/cmdline-tools/latest/ || true
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.1.8937393"
          echo "sdk.dir=$ANDROID_HOME" > $GITHUB_WORKSPACE/local.properties
      - name: Build APK with engines + 485 beats inside
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          buildozer android debug
      - name: Upload KALA Self-Building APK 485 beats
        uses: actions/upload-artifact@v4
        with:
          name: KALA-V20-SELF-BUILDING-485
          path: bin/*.apk
